name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore TaskFlow.slnx
      - name: Build
        run: dotnet build TaskFlow.slnx -c Release --no-restore --warnaserror
      - name: Run tests
        run: dotnet test TaskFlow.slnx -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
